app = "dashfi-kb-staging"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile.caddy"

[deploy]
  release_command = "sh -lc 'corepack enable && yarn db:migrate'"

[env]
  FILE_STORAGE = "s3"
  FORCE_HTTPS = "false"
  LOG_LEVEL = "info"
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/_health"

[mounts]
  source = "outline_data"
  destination = "/var/lib/outline/data"

[[vm]]
  memory_mb = 1024
  cpu_kind = "shared"
  cpus = 1
