app = "dashfi-kb-staging"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[mounts]
  source = "outline_data"
  destination = "/var/lib/outline/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
